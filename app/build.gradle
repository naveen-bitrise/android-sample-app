plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.example.android_sample_app'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.android_sample_app"
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
    // --- GMD Configuration Starts Here (Groovy DSL) ---
    testOptions {
        managedDevices {
            devices {
                // Register a new Gradle Managed Device for our CI tests.
                // The task name will be derived from this, e.g., "pixel4gbCiTestDebugAndroidTest".
                pixel4gbCiTest(com.android.build.api.dsl.ManagedVirtualDevice) {
                    // This is the critical link. The device name here MUST exactly match
                    // the name we generate in the bitrise.yml script step.
                    device = "ci_pixel_4gb"

                    // Use an API level and system image appropriate for your tests.
                    // "google-atd" (Automated Test Device) images are optimized for performance in CI.
                    apiLevel = 36
                    systemImageSource = "google"
                }
            }
        }
    }
    // --- GMD Configuration Ends Here ---
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}